<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="oneTime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Budget Chart Visual -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- Base Wallet / Card Shape -->
    <rect x="0" y="40" width="320" height="240" rx="40" fill="#1e293b" stroke="#475569" stroke-width="6" />
    
    <!-- Decorative Card Header -->
    <rect x="0" y="40" width="320" height="60" rx="40" fill="url(#primary)" />
    <circle cx="280" cy="70" r="12" fill="#ffffff" opacity="0.8" />
    
    <!-- Stacked Trend Bars inside Card -->
    <!-- Normal bar (Emerald) + One-Time top (Amber) -->
    <rect x="50" y="160" width="36" height="80" rx="8" fill="url(#accent)" />
    <rect x="50" y="125" width="36" height="30" rx="8" fill="url(#oneTime)" />
    
    <rect x="110" y="140" width="36" height="100" rx="8" fill="url(#accent)" />
    <rect x="110" y="110" width="36" height="25" rx="8" fill="url(#oneTime)" />
    
    <rect x="170" y="170" width="36" height="70" rx="8" fill="url(#accent)" />
    <rect x="170" y="130" width="36" height="35" rx="8" fill="url(#oneTime)" />
    
    <rect x="230" y="130" width="36" height="110" rx="8" fill="url(#accent)" />
    <rect x="230" y="90" width="36" height="35" rx="8" fill="url(#oneTime)" />

    <!-- Currency / Trend Sparkle -->
    <circle cx="250" cy="18" r="32" fill="url(#primary)" stroke="#0f172a" stroke-width="6" />
    <path d="M250 2 L250 34 M238 8 C238 8 244 5 250 5 C256 5 262 9 262 14 C262 20 252 22 248 24 C244 26 238 29 238 35 C238 41 244 44 250 44 C256 44 262 41 262 41" 
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
